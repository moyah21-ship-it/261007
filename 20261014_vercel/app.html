<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의사록 자동작성 PoC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  /* Layout: fixed institutional header + horizontal tab rail over a single scrolling work column */
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#1a2230; --muted:#5b6778;
    --line:#dfe3ea; --line-strong:#c6ccd8;
    --accent:#1f3a63; --accent-soft:#eaf0f8; --accent-ink:#2c4f85;
    --warn:#b4432b; --warn-soft:#fbeae6; --info:#2a6f52; --info-soft:#e7f3ec;
    --gold:#9a7b2e;
    --serif:"Noto Serif KR",serif;
    --sans:"Noto Sans KR",system-ui,sans-serif;
    --radius:10px; --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 22px rgba(20,30,50,.05);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e141f; --panel:#161e2b; --panel-2:#131a26; --ink:#e7ecf3; --muted:#9aa6b6;
    --line:#273142; --line-strong:#36435a;
    --accent:#8fb3e6; --accent-soft:#1a2740; --accent-ink:#aecaf3;
    --warn:#f0917a; --warn-soft:#331c17; --info:#7fd3a7; --info-soft:#16281f;
    --gold:#d8b25f; color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e141f; --panel:#161e2b; --panel-2:#131a26; --ink:#e7ecf3; --muted:#9aa6b6;
    --line:#273142; --line-strong:#36435a;
    --accent:#8fb3e6; --accent-soft:#1a2740; --accent-ink:#aecaf3;
    --warn:#f0917a; --warn-soft:#331c17; --info:#7fd3a7; --info-soft:#16281f;
    --gold:#d8b25f; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0}

  /* Header */
  header.top{background:var(--accent);color:#fff}
  :root:not([data-theme="light"]) header.top, :root[data-theme="dark"] header.top{background:#101a2c}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top{background:#101a2c}}
  .top-inner{max-width:1080px;margin:0 auto;padding:18px 16px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
  .brand{display:flex;flex-direction:column;gap:3px;min-width:0}
  .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#bcd0ee;font-weight:500}
  .brand h1{font-family:var(--serif);font-weight:700;font-size:clamp(19px,3.4vw,26px);margin:0;letter-spacing:-.01em;text-wrap:balance;color:#fff}
  .meta-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:#cdddf2}
  .meta-row b{color:#fff;font-weight:500}
  .demo-flag{font-size:11px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#eaf2ff;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .theme-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer}
  .theme-btn:hover{background:rgba(255,255,255,.22)}

  /* Tabs */
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .tabs-inner{max-width:1080px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{appearance:none;background:none;border:none;font:inherit;color:var(--muted);padding:13px 15px 11px;cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
  .tab .n{font-family:var(--serif);font-size:13px;width:21px;height:21px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .tab[aria-selected="true"] .n{background:var(--accent);color:#fff}
  .tab .pill{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}

  main{padding-block:22px 48px}
  section[role=tabpanel]{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){section[role=tabpanel],section[role=tabpanel] *{animation:none!important}}

  .lead{color:var(--muted);font-size:13.5px;margin:-4px 0 18px;max-width:64ch}
  h2.sec{font-family:var(--serif);font-size:18px;font-weight:700;margin:26px 0 12px;letter-spacing:-.01em}
  h2.sec:first-of-type{margin-top:4px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  .stat-row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .stat{padding:15px 16px}
  .stat .k{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .stat .v{font-family:var(--serif);font-size:25px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:13px;color:var(--muted);font-weight:500;font-family:var(--sans)}
  .stat.ok .v{color:var(--info)}

  table{border-collapse:collapse;width:100%;font-size:13px}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  thead th{background:var(--panel-2);font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.02em;position:sticky;top:0}
  tbody tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .st-present{background:var(--info-soft);color:var(--info)}
  .st-absent{background:var(--warn-soft);color:var(--warn)}
  .st-leave{background:#fff3e0;color:var(--gold)}
  :root:not([data-theme="light"]) .st-leave,:root[data-theme="dark"] .st-leave{background:#2c2410}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-leave{background:#2c2410}}
  .st-none{background:var(--line);color:var(--muted)}

  .type-q{background:#eef1fb;color:#3a51a8}
  .type-a{background:var(--info-soft);color:var(--info)}
  .type-op{background:#f3edf9;color:#7a4da0}
  .type-req{background:#fdf0e6;color:var(--gold)}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .type-q{background:#1b2440;color:#aec0ef}
    :root:not([data-theme="light"]) .type-a{background:#16281f;color:#7fd3a7}
    :root:not([data-theme="light"]) .type-op{background:#281a33;color:#c9a6e6}
    :root:not([data-theme="light"]) .type-req{background:#2c2211;color:#e6c07a}
  }
  :root[data-theme="dark"] .type-q{background:#1b2440;color:#aec0ef}
  :root[data-theme="dark"] .type-op{background:#281a33;color:#c9a6e6}
  :root[data-theme="dark"] .type-req{background:#2c2211;color:#e6c07a}

  /* Agenda cards */
  .agenda{padding:0;margin-bottom:16px;overflow:hidden}
  .agenda>.head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .agenda .no{font-family:var(--serif);font-weight:700;color:var(--accent-ink);font-size:14px}
  .agenda .title{font-weight:700;font-size:14.5px;flex:1;min-width:140px}
  .kind{font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
  .kind.vote{background:#f6ecec;color:var(--warn)}
  :root:not([data-theme="light"]) .kind.vote,:root[data-theme="dark"] .kind.vote{background:#2a1a18;color:var(--warn)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kind.vote{background:#2a1a18}}
  .decis{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line-strong)}
  .decis.pass{background:var(--info-soft);color:var(--info);border-color:transparent}
  .decis.cond{background:#fff3e0;color:var(--gold);border-color:transparent}
  :root:not([data-theme="light"]) .decis.cond,:root[data-theme="dark"] .decis.cond{background:#2c2410}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .decis.cond{background:#2c2410}}
  .decis.recv{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
  .agenda .body{padding:14px 16px}
  .summary{font-size:13.5px;margin:0 0 12px;padding-left:12px;border-left:3px solid var(--accent-soft)}
  .disc{font-size:12.5px}
  .disc td:first-child{white-space:nowrap}
  .srcline{font-variant-numeric:tabular-nums;font-size:11px;color:var(--accent-ink);background:var(--accent-soft);border:none;border-radius:5px;padding:1px 7px;cursor:pointer;font-family:var(--sans)}
  .srcline:hover{background:var(--accent);color:#fff}
  .votes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12px}
  .votes .vb{padding:4px 10px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line)}
  .votes .vb b{font-variant-numeric:tabular-nums}
  .note-line{font-size:12px;color:var(--muted);margin-top:10px;padding:8px 11px;background:var(--panel-2);border-radius:7px;border:1px dashed var(--line-strong)}

  .btn{appearance:none;font:inherit;font-weight:500;font-size:13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:8px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .hint{font-size:12px;color:var(--muted)}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;border:1px dashed var(--line-strong);border-radius:var(--radius)}

  /* findings */
  .filterbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .chip{appearance:none;font:inherit;font-size:12.5px;border:1px solid var(--line-strong);background:var(--panel);color:var(--muted);padding:5px 13px;border-radius:999px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .finding{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
  .finding:last-child{border-bottom:none}
  .finding .rule{font-family:var(--serif);font-weight:700;font-size:12.5px;min-width:30px;color:var(--muted)}
  .finding .lvl{flex-shrink:0}
  .lvl-warn{background:var(--warn-soft);color:var(--warn)}
  .lvl-info{background:var(--info-soft);color:var(--info)}
  .finding .ftxt{font-size:13px;min-width:0}
  .finding .ftxt .tgt{font-weight:700;font-size:12px;color:var(--accent-ink);margin-right:6px}

  /* speakers */
  .spk{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .spk:last-child{border-bottom:none}
  .spk .sid{font-family:var(--serif);font-weight:700;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 11px;white-space:nowrap}
  .spk .arrow{color:var(--muted)}
  .spk select{font:inherit;font-size:13px;padding:6px 9px;border-radius:7px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);max-width:100%}
  .spk .why{font-size:11.5px;color:var(--muted);grid-column:2/3}
  .conf{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px}
  .conf.hi{background:var(--info-soft);color:var(--info)}
  .conf.mid{background:#fff3e0;color:var(--gold)}
  :root:not([data-theme="light"]) .conf.mid,:root[data-theme="dark"] .conf.mid{background:#2c2410}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .conf.mid{background:#2c2410}}

  /* review / output */
  .editgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .fld input,.fld textarea{font:inherit;font-size:13px;padding:7px 10px;border-radius:7px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--ink)}
  .fld textarea{resize:vertical;min-height:62px}
  .confirmed-note{display:none;align-items:center;gap:8px;font-size:12.5px;color:var(--info);background:var(--info-soft);padding:8px 13px;border-radius:8px;margin-bottom:14px}

  /* document preview (mimics the .docx 양식) */
  .doc{font-family:var(--serif);background:#fff;color:#1a1a1a;border:1px solid var(--line-strong);border-radius:4px;box-shadow:var(--shadow);padding:clamp(20px,4vw,44px);max-width:760px;margin:0 auto;line-height:1.75}
  :root:not([data-theme="light"]) .doc,:root[data-theme="dark"] .doc{background:#f3f1ea;color:#1a1a1a}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .doc{background:#f3f1ea;color:#1a1a1a}}
  .doc h3{text-align:center;font-size:21px;font-weight:700;letter-spacing:.14em;margin:0 0 4px}
  .doc .dsub{text-align:center;font-size:12.5px;color:#7a6f52;font-family:var(--sans);letter-spacing:.05em;margin-bottom:22px}
  .doc .dmeta{width:100%;border:1px solid #cbb; font-size:12.5px;font-family:var(--sans);margin-bottom:20px}
  .doc .dmeta th,.doc .dmeta td{border:1px solid #d8cdb0;padding:7px 10px;color:#2a2a2a}
  .doc .dmeta th{background:#efe8d4;width:88px;font-weight:700;white-space:nowrap}
  .doc h4{font-size:14.5px;font-weight:700;margin:20px 0 6px;padding-bottom:3px;border-bottom:1.5px solid #b9a86a}
  .doc p{margin:5px 0;font-size:13.5px}
  .doc .dlabel{font-family:var(--sans);font-size:11.5px;font-weight:700;color:#6b5d2f;letter-spacing:.04em}
  .doc ul{margin:4px 0 4px;padding-left:20px;font-size:13px}
  .doc .dtbl{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:12px;margin:10px 0 4px}
  .doc .dtbl th,.doc .dtbl td{border:1px solid #cdbf93;padding:6px 8px;color:#2a2a2a}
  .doc .dtbl th{background:#efe8d4;font-weight:700}
  .doc .sign{text-align:center;margin-top:30px;font-size:14px;letter-spacing:.04em}
  .doc .sign .role{display:inline-block;margin:6px 20px;font-size:13.5px}

  footer{border-top:1px solid var(--line);margin-top:10px;padding:18px 0 4px;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.7}
  code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="eyebrow">금융소비자보호위원회 · 의사록 자동작성</span>
      <h1>2026년 제9차 회의록</h1>
      <div class="meta-row">
        <span>일시 <b>2026. 11. 20.(금) 14:00~14:25</b></span>
        <span>장소 <b>본사 대회의실</b></span>
        <span>위원장 <b>한도윤</b></span>
        <span>간사 <b>차민서</b></span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px;align-items:flex-end">
      <button class="theme-btn" id="themeBtn" type="button">◐ 테마</button>
      <span class="demo-flag">교육용 가상 자료 · 모의(mock) 모드</span>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="작업 단계">
  <div class="tabs-inner" role="tablist" id="tablist"></div>
</nav>

<main class="wrap" id="panels"></main>

<footer class="wrap">
  AI 기반 의사록 자동작성 교육용 PoC — 녹취 → AI 추출 → 업무규칙(R1~R14) 검증 → 담당자 확정 → 의사록(.docx) 출력.<br>
  모든 인물·수치·안건은 가상이며 실제 회사·위원회와 무관합니다. 실제 회사자료·개인정보·고객정보는 입력하지 마십시오.
</footer>

<script>
/* ---------- 데이터 (더미) ---------- */
const MEMBERS=[
  {id:"M01",name:"한도윤",role:"위원장",dept:"금융소비자보호본부",pos:"본부장",voting:true,status:"출석"},
  {id:"M02",name:"서지후",role:"위원",dept:"상품본부",pos:"본부장",voting:true,status:"출석"},
  {id:"M03",name:"남궁별",role:"위원",dept:"영업기획본부",pos:"본부장",voting:true,status:"출석"},
  {id:"M04",name:"오세린",role:"위원",dept:"GA사업본부",pos:"본부장",voting:true,status:"출석(14:16 이석)"},
  {id:"M05",name:"윤태경",role:"위원",dept:"계약관리본부",pos:"본부장",voting:true,status:"출석"},
  {id:"M06",name:"배하람",role:"위원",dept:"준법감시팀",pos:"준법감시인",voting:true,status:"출석"},
  {id:"M07",name:"진유나",role:"위원",dept:"보험금심사팀",pos:"팀장",voting:true,status:"불참"},
  {id:"S01",name:"차민서",role:"간사",dept:"소비자보호부",pos:"과장",voting:false,status:"출석(의결권 없음)"},
];
const NAME=id=>{const m=MEMBERS.find(x=>x.id===id);return m?m.name:id};
const OVERVIEW={total:7,present:6,absent:1,rate:85.7,duration:25,
  quorum:"충족 (출석 6명 > 재적 7명의 과반 3.5명)",
  presentText:"6명 (출석률 85.7%) ※ 오세린 위원 14:16 이석, 이후 출석 5명",
  absentText:"1명 (진유나 위원)"};

const AGENDAS=[
 {no:1,type:"보고",title:"2026년 3분기 민원 현황 보고",presenter:"소비자보호부",
  summary:"3분기 접수 민원은 총 412건으로 전분기(449건) 대비 8.2% 감소함. 유형별 비중은 보험금 지급 46%, 불완전판매 21%, 계약 유지·관리 18%, 기타 15%이며, 보험금 지급 관련 민원 비중은 전분기 대비 5%p 증가함.",

const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

const statusBadge=s=>{

};

function goTab(id){

  const done=ok=>{const o=btn.textContent;btn.textContent=ok?"✓ 복사됨":"선택하세요";setTimeout(()=>btn.textContent=o,1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>selectEl(doc,done));
  }else selectEl(doc,done);
}
function selectEl(el,cb){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);cb(false);}catch(e){cb(false);}}

/* ---------- 패널: ⑤ 화자 매핑 ---------- */
function panelSpeakers(){
  const p=E("section");p.id="panel-speakers";p.setAttribute("role","tabpanel");p.setAttribute("aria-labelledby","tab-speakers");
  p.innerHTML=`<p class="lead">'화자1, 화자2…'로만 표시된 STT 녹취록(04-2)의 화자를 위원명단에 매핑합니다. 발언 패턴으로 후보를 제안하면 담당자가 확정합니다. <span class="hint">(FR-13 · 확장 과제)</span></p>`;

  const bar=E("div","toolbar");
  bar.innerHTML=`<button class="btn primary" id="applyMapBtn">✓ 제안 일괄 적용</button>
    <span class="hint" id="mapHint">7명의 화자에 대한 매핑 제안입니다. 드롭다운에서 직접 바꿀 수 있습니다.</span>`;
  p.appendChild(bar);

  const card=E("div","card");card.id="spkCard";
  card.innerHTML=SPEAKER_SUGGEST.map((s,i)=>{
    const opts=MEMBERS.map(m=>`<option value="${m.id}" ${m.id===s.member?"selected":""}>${esc(m.name)} (${esc(m.role==="간사"?"간사":m.dept)})</option>`).join("");
    return `<div class="spk">
      <span class="sid">${esc(s.sid)}</span>
      <select id="spk-${i}" aria-label="${esc(s.sid)} 매핑">${opts}</select>
      <span class="conf ${s.conf}">${s.conf==="hi"?"신뢰 높음":"확인 권장"}</span>
      <span class="why">↳ ${esc(s.why)}</span>
    </div>`;
  }).join("");
  p.appendChild(card);

  setTimeout(()=>{
    const b=document.getElementById("applyMapBtn");
    if(b)b.onclick=()=>{document.getElementById("mapHint").innerHTML='<span style="color:var(--info)">✓ 7명 매핑 적용 완료 — 이제 녹취록이 위원명단과 연결되어 AI 추출을 진행할 수 있습니다.</span>';};
  },0);
  return p;
}

/* ---------- 조립 ---------- */
function syncBadges(){
  const t=document.getElementById("tab-rules");
  if(t&&!t.querySelector(".pill")){/* keep */}
}
function build(){
  buildTabs();
  const panels=document.getElementById("panels");
  panels.appendChild(panelOverview());
  panels.appendChild(panelExtract());
  panels.appendChild(panelRules());
  panels.appendChild(panelReview());
  panels.appendChild(panelSpeakers());
  let start="overview";
  try{const h=location.hash.replace("#","");if(TABS.some(t=>t.id===h))start=h;}catch(e){}
  goTab(start);
}

/* 테마 토글 */
document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement;
  const cur=r.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme",dark?"light":"dark");
};

build();
</script>
